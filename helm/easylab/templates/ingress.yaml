{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "easylab.fullname" . }}-ingress
  namespace: {{ include "easylab.namespace" . }}
  labels:
    {{- include "easylab.labels" . | nindent 4 }}
  {{- $auto := dict }}
  {{- if and .Values.certManager.clusterIssuer.create .Values.ingress.tls.enabled }}
  {{- $auto = dict "cert-manager.io/cluster-issuer" .Values.certManager.clusterIssuer.name }}
  {{- end }}
  {{- $annotations := merge (dict) .Values.ingress.annotations $auto }}
  {{- if $annotations }}
  annotations:
    {{- toYaml $annotations | nindent 4 }}
  {{- end }}
spec:
  {{- if .Values.ingress.className }}
  ingressClassName: {{ .Values.ingress.className }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts:
        - {{ .Values.ingress.host }}
      secretName: {{ .Values.ingress.tls.secretName }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "easylab.fullname" . }}-service
                port:
                  number: {{ .Values.service.port }}
{{- end }}
