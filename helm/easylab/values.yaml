nameOverride: easylab

namespace:
  create: true
  name: easylab

image:
  repository: docker.io/yodamad/easylab
  tag: ""  # defaults to v<appVersion> if appVersion has no leading v (matches release images)
  pullPolicy: Always

replicaCount: 1

# Raised in the container entrypoint (ulimit -n) so Pulumi/fsnotify does not hit RLIMIT_NOFILE in pods.
runtime:
  openFilesLimit: 65536

config:
  port: "8080"
  workDir: "/app/jobs"
  dataDir: "/app/data"

secrets:
  create: true
  adminPassword: ""
  studentPassword: ""
  ovh:
    applicationKey: ""
    applicationSecret: ""
    consumerKey: ""
    serviceName: ""
    endpoint: "ovh-eu"

persistence:
  jobs:
    size: 1Gi
    storageClass: ""
  data:
    size: 200Mi
    storageClass: ""

service:
  type: ClusterIP
  port: 80
  annotations: {}

ingress:
  enabled: false
  className: traefik
  annotations: {}
  host: easylab.example.com
  tls:
    enabled: false
    secretName: easylab-tls

resources:
  requests:
    memory: "1024Mi"
    cpu: "500m"
  limits:
    memory: "4096Mi"
    cpu: "3000m"

# Optional: pin the EasyLab server pod to specific nodes (e.g. a "control-plane"
# node pool), separate from where student workspaces run.
nodeSelector: {}

tolerations: []

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

# Set enabled: true to install Traefik as part of this chart. The IngressClass
# name is pinned to "traefik" to match ingress.className's default, so it works
# out of the box — no extra values needed.
# Leave false (default) if your cluster already has an ingress controller
# (e.g. k3s ships Traefik out of the box).
traefik:
  enabled: false
  ingressClass:
    name: traefik

# Set enabled: true to install cert-manager as part of this chart.
# Leave false (default) if your cluster already has cert-manager.
# crds.enabled installs the cert-manager CRDs (required on first install).
cert-manager:
  enabled: false
  crds:
    enabled: true
