nameOverride: easylab

namespace:
  create: true
  name: easylab

image:
  repository: docker.io/yodamad/easylab
  tag: ""  # defaults to v<appVersion> if appVersion has no leading v (matches release images)
  pullPolicy: Always

replicaCount: 1

# Raised in the container entrypoint (ulimit -n) so Pulumi/fsnotify does not hit RLIMIT_NOFILE in pods.
runtime:
  openFilesLimit: 65536

config:
  port: "8080"
  workDir: "/app/jobs"
  dataDir: "/app/data"

secrets:
  create: true
  adminPassword: ""
  studentPassword: ""
  ovh:
    applicationKey: ""
    applicationSecret: ""
    consumerKey: ""
    serviceName: ""
    endpoint: "ovh-eu"

persistence:
  jobs:
    size: 1Gi
    storageClass: ""
  data:
    size: 200Mi
    storageClass: ""

service:
  type: ClusterIP
  port: 80
  annotations: {}

ingress:
  enabled: false
  className: traefik
  annotations: {}
  host: easylab.example.com
  tls:
    enabled: false
    secretName: easylab-tls

resources:
  requests:
    memory: "1024Mi"
    cpu: "500m"
  limits:
    memory: "4096Mi"
    cpu: "3000m"

# Optional: pin the EasyLab server pod to specific nodes (e.g. a "control-plane"
# node pool), separate from where student workspaces run.
nodeSelector: {}

tolerations: []

securityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000

# Set enabled: true to install Traefik as part of this chart. The IngressClass
# name is pinned to "traefik" to match ingress.className's default, so it works
# out of the box — no extra values needed.
# Leave false (default) if your cluster already has an ingress controller
# (e.g. k3s ships Traefik out of the box).
traefik:
  enabled: false
  ingressClass:
    name: traefik

# Set enabled: true to install cert-manager as part of this chart.
# Leave false (default) if your cluster already has cert-manager.
# crds.enabled installs the cert-manager CRDs (required on first install).
cert-manager:
  enabled: false
  crds:
    enabled: true

# Automates a Let's Encrypt ClusterIssuer for the EasyLab ingress's own TLS
# certificate (see ingress.tls above). Requires cert-manager to be present in
# the cluster: either cert-manager.enabled=true above, or a pre-existing
# install.
#
# IMPORTANT — namespace alignment: certManager.namespace must match wherever
# cert-manager's own pods actually run. cert-manager.enabled=true installs it
# as a normal Helm dependency, which lands in whatever --namespace you pass to
# `helm install`/`helm upgrade` (NOT this chart's own namespace.name) — always
# pass --namespace cert-manager explicitly when using this feature. If
# cert-manager is pre-installed separately, use its actual namespace (commonly
# "cert-manager"). Verify with: kubectl get pods -n cert-manager
#
# Two solver modes:
#   - HTTP-01 (default): no DNS provider needed, but the ingress host must be
#     reachable on port 80 for the ACME challenge.
#   - Azure DNS-01 (set dns.azure.enabled=true below): uses cert-manager's
#     built-in azureDNS solver, no port-80 requirement.
# For OVH DNS-01, use dns.ovh below instead — it manages its own ClusterIssuer
# end-to-end via the vendored cert-manager-webhook-ovh chart. Enable only one
# mechanism at a time (certManager.clusterIssuer.create OR dns.ovh.enabled).
certManager:
  namespace: cert-manager
  clusterIssuer:
    create: false
    name: letsencrypt
    email: ""
    # Let's Encrypt production. Override to
    # https://acme-staging-v02.api.letsencrypt.org/directory while testing to
    # avoid production rate limits.
    server: https://acme-v02.api.letsencrypt.org/directory

# DNS-01 provider settings for certManager.clusterIssuer (Azure) and for the
# vendored OVH webhook chart below.
dns:
  # Azure DNS-01 credentials for certManager.clusterIssuer above (service
  # principal / client secret auth).
  azure:
    enabled: false
    zone: ""             # Azure DNS hosted zone name, e.g. "example.com"
    tenantId: ""
    subscriptionId: ""
    resourceGroup: ""
    clientId: ""
    clientSecret: ""

  # OVH DNS-01: enabled: true installs the cert-manager-webhook-ovh chart as a
  # dependency (see Chart.yaml), which creates its own ClusterIssuer,
  # credential Secret, and RBAC end-to-end — nothing under certManager above
  # needs to be set for OVH beyond cert-manager being present. The nested
  # cert-manager-webhook-ovh block below configures that subchart directly
  # (it enforces its own values schema, so it cannot carry an "enabled" field
  # itself — that lives here instead). Its certManager.namespace /
  # certManager.serviceAccountName must match your actual cert-manager install
  # (defaults assume `helm install easylab` with cert-manager.enabled=true and
  # --namespace cert-manager — see the namespace alignment note above).
  ovh:
    enabled: false
    # The OVH DNS zone ingress.host is a subdomain of, e.g. "example.com" for
    # an ingress.host of "easylab.example.com". cert-manager-webhook-ovh above
    # derives its own zone automatically from the ACME domain, so this is not
    # needed for DNS-01 alone — only required when dns.externalDns.enabled is
    # also true, since ExternalDNS's --domain-filter needs the zone itself
    # (passing the ingress hostname instead makes every zone lookup return
    # empty and ExternalDNS silently creates no record).
    zone: ""

  # Persistent ExternalDNS controller that keeps ingress.host's A record
  # pointed at the ingress controller's LoadBalancer IP — automates the "go
  # create the A record by hand" step that DNS-01 alone does not cover (DNS-01
  # only proves domain ownership via an ephemeral ACME TXT record; it never
  # touches the actual A record). Reuses the OVH/Azure credentials already
  # configured above and in cert-manager-webhook-ovh.issuers[0] — nothing new
  # to fill in beyond dns.ovh.zone for OVH. Requires exactly one of
  # dns.ovh.enabled / dns.azure.enabled. Deliberately its own flag rather than
  # turning on automatically whenever DNS-01 is configured, so an install that
  # already manages its A record another way is not surprised by a new
  # standing component.
  externalDns:
    enabled: false
    image:
      repository: registry.k8s.io/external-dns/external-dns
      tag: "v0.22.0"
    # "sync" also deletes the record if it's no longer needed (e.g.
    # ingress.host changes); "upsert-only" only ever creates/updates, never
    # deletes.
    policy: sync
    # Scopes ExternalDNS's TXT ownership registry so this install never
    # touches DNS records owned by another ExternalDNS instance sharing the
    # same zone. Empty string defaults to the release fullname.
    txtOwnerId: ""
    # Logs planned DNS changes without calling the provider API. Recommended
    # true for a first rollout against a real zone, then flip to false.
    dryRun: false
    resources:
      requests:
        memory: "64Mi"
        cpu: "50m"
      limits:
        memory: "256Mi"
        cpu: "200m"

# Raw values for the vendored cert-manager-webhook-ovh chart (see dns.ovh
# above). Deeply nested — see
# https://github.com/aureq/cert-manager-webhook-ovh for the full schema.
cert-manager-webhook-ovh:
  groupName: acme.easylab.local
  certManager:
    namespace: cert-manager
    serviceAccountName: easylab-cert-manager
  issuers:
    - name: letsencrypt-ovh
      create: true
      kind: ClusterIssuer
      acmeServerUrl: https://acme-v02.api.letsencrypt.org/directory
      email: ""
      ovhEndpointName: ovh-eu
      ovhAuthenticationMethod: application
      ovhAuthentication:
        applicationKey: ""
        applicationSecret: ""
        applicationConsumerKey: ""
