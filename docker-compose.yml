version: '3.8'

services:
  easylab:
    # Change the image to the latest tag for non-development environments
    image: docker.io/yodamad/easylab:v1.2.0
    ports:
      - "8080:8080"
    volumes:
      # Persist job workspaces - critical for ongoing lab deployments
      - lab_jobs:/app/jobs
      # Persist application data - contains job metadata and configurations
      - lab_data:/app/data
    environment:
      - PORT=8080
      - WORK_DIR=/app/jobs
      - DATA_DIR=/app/data
      # Required: compose refuses to start without it. There is deliberately no
      # default, so an instance can never come up on a password from this file.
      - LAB_ADMIN_PASSWORD=${LAB_ADMIN_PASSWORD:?set LAB_ADMIN_PASSWORD to a strong password before starting}
      # Optional: leaving it unset disables student password login.
      - LAB_STUDENT_PASSWORD=${LAB_STUDENT_PASSWORD}
      # Required because DATA_DIR is set above: encrypts the cluster kubeconfigs
      # and DNS credentials in persisted job files. Generate with
      # `openssl rand -base64 32` and keep it stable — a different key leaves
      # existing labs unreadable.
      - LAB_DATA_ENCRYPTION_KEY=${LAB_DATA_ENCRYPTION_KEY:?generate one with: openssl rand -base64 32}
      # Set OVH credentials via environment variables (change these!)
      - OVH_APPLICATION_KEY=${OVH_APPLICATION_KEY}
      - OVH_APPLICATION_SECRET=${OVH_APPLICATION_SECRET}
      - OVH_CONSUMER_KEY=${OVH_CONSUMER_KEY}
      - OVH_SERVICE_NAME=${OVH_SERVICE_NAME}
      - OVH_ENDPOINT=${OVH_ENDPOINT}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - lab-network

volumes:
  lab_jobs:
    driver: local
  lab_data:
    driver: local

networks:
  lab-network:
    driver: bridge
